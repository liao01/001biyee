spring.application.name=business
server.servlet.context-path=/lyw
server.port=8080
server.address=0.0.0.0

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.jiawa.lyw.mapper=trace

spring.data.redis.host=${REDIS_HOST:127.0.0.1}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

langchain4j.open-ai.chat-model.base-url=${DEEPSEEK_BASE_URL}
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=${DEEPSEEK_MODEL:deepseek-chat}
langchain4j.open-ai.chat-model.temperature=${DEEPSEEK_TEMPERATURE:0.9}

langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=${DASHSCOPE_CHAT_MODEL:qwen-max}
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=${DASHSCOPE_STREAMING_MODEL:qwen-plus}

spring.data.mongodb.uri=${MONGODB_URI:mongodb://localhost:27017/db_chat_memory}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB
