spring.application.name=business
server.servlet.context-path=/lyw
server.port=8080
server.address=0.0.0.0
app.storage.upload-dir=${UPLOAD_DIR:/data/uploads}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.jiawa.lyw.mapper=info

spring.data.redis.host=${REDIS_HOST:lyw-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.mongodb.uri=${MONGODB_URI}

langchain4j.open-ai.chat-model.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=${DEEPSEEK_MODEL_NAME:deepseek-chat}
langchain4j.open-ai.chat-model.temperature=${DEEPSEEK_TEMPERATURE:0.7}
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=${DASHSCOPE_MODEL_NAME:qwen-max}
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=${DASHSCOPE_STREAMING_MODEL_NAME:qwen-max}

mail.username=${MAIL_USERNAME}
mail.auth-code=${MAIL_AUTH_CODE}
jwt.secret=${JWT_SECRET}
rag.server.url=${RAG_URL:http://127.0.0.1:3001}
rag.server.slug=${RAG_WORKSPACE_SLUG}
rag.server.auth.apikey=${RAG_API_KEY}
amap.key=${AMAP_API_KEY}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.metrics.tags.application=${spring.application.name}
