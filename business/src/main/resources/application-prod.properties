spring.application.name=business
server.servlet.context-path=/lyw
server.port=8080
server.address=0.0.0.0
app.storage.upload-dir=${UPLOAD_DIR:/data/uploads}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
mybatis.mapper-locations=classpath:/mapper/**/*.xml
mybatis.configuration.map-underscore-to-camel-case=true
logging.level.com.jiawa.lyw.mapper=info

spring.data.redis.host=${REDIS_HOST:lyw-redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD}
spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms
spring.data.mongodb.uri=${MONGODB_URI}

langchain4j.open-ai.chat-model.base-url=${DEEPSEEK_BASE_URL:https://api.deepseek.com}
langchain4j.open-ai.chat-model.api-key=${DEEPSEEK_API_KEY}
langchain4j.open-ai.chat-model.model-name=${DEEPSEEK_MODEL_NAME:deepseek-chat}
langchain4j.open-ai.chat-model.temperature=${DEEPSEEK_TEMPERATURE:0.7}
langchain4j.community.dashscope.chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.chat-model.model-name=${DASHSCOPE_MODEL_NAME:qwen-max}
langchain4j.community.dashscope.streaming-chat-model.api-key=${DASHSCOPE_API_KEY}
langchain4j.community.dashscope.streaming-chat-model.model-name=${DASHSCOPE_STREAMING_MODEL_NAME:qwen-max}

mail.username=${MAIL_USERNAME}
mail.auth-code=${MAIL_AUTH_CODE}
jwt.secret=${JWT_SECRET}
app.public-url=${APP_PUBLIC_URL}
identity.secure-cookie=true
logging.level.com.jiawa.lyw.identity=info
app.ai.itinerary.dify.base-url=${DIFY_ITINERARY_BASE_URL}
app.ai.itinerary.dify.api-key=${DIFY_ITINERARY_API_KEY}
app.ai.itinerary.dify.user-hash-key=${DIFY_ITINERARY_USER_HASH_KEY}
app.ai.itinerary.dify.contract-version=${DIFY_ITINERARY_CONTRACT_VERSION:itinerary-revision/v1}
app.ai.itinerary.dify.connect-timeout=${DIFY_ITINERARY_CONNECT_TIMEOUT:2s}
app.ai.itinerary.dify.read-timeout=${DIFY_ITINERARY_READ_TIMEOUT:45s}
app.ai.itinerary.dify.max-response-bytes=${DIFY_ITINERARY_MAX_RESPONSE_BYTES:262144}
app.ai.itinerary.dify.max-operations=${DIFY_ITINERARY_MAX_OPERATIONS:80}
amap.key=${AMAP_API_KEY}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.endpoint.env.show-values=never
management.endpoint.configprops.show-values=never
management.metrics.tags.application=${spring.application.name}
