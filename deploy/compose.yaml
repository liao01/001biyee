name: lyw

services:
  lyw-mysql:
    image: mysql:8.4.6
    container_name: lyw-mysql
    restart: unless-stopped
    mem_limit: 384m
    env_file: /opt/lyw/secrets/runtime.env
    volumes:
      - /opt/lyw/data/mysql:/var/lib/mysql
      - /opt/lyw/current/sql/travel_share.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
      - /opt/lyw/current/deploy/mysql/low-memory.cnf:/etc/mysql/conf.d/low-memory.cnf:ro
    networks: [lyw_internal]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12

  lyw-mongo:
    image: mongo:7.0.23
    container_name: lyw-mongo
    restart: unless-stopped
    mem_limit: 384m
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25", "--bind_ip_all"]
    env_file: /opt/lyw/secrets/runtime.env
    volumes:
      - /opt/lyw/data/mongo:/data/db
      - /opt/lyw/current/deploy/mongo/init.js:/docker-entrypoint-initdb.d/001-app-user.js:ro
    networks: [lyw_internal]
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  lyw-redis:
    image: redis:7.4.5-alpine
    container_name: lyw-redis
    restart: unless-stopped
    mem_limit: 96m
    env_file: /opt/lyw/secrets/runtime.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\" --maxmemory 64mb --maxmemory-policy allkeys-lru"]
    volumes:
      - /opt/lyw/data/redis:/data
    networks: [lyw_internal]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping 2>/dev/null | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 12

  lyw-storage-init:
    image: lyw-backend:${RELEASE_ID:-current}
    container_name: lyw-storage-init
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["mkdir -p /data/uploads && chown -R app:app /data/uploads"]
    restart: "no"
    network_mode: none
    volumes:
      - /opt/lyw/data/uploads:/data/uploads

  lyw-backend:
    build:
      context: /opt/lyw/current
      dockerfile: deploy/backend/Dockerfile
    image: lyw-backend:${RELEASE_ID:-current}
    container_name: lyw-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file: /opt/lyw/secrets/runtime.env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      JAVA_TOOL_OPTIONS: -Xms128m -Xmx256m -XX:MaxMetaspaceSize=128m
      UPLOAD_DIR: /data/uploads
      REDIS_HOST: lyw-redis
      REDIS_PORT: "6379"
    volumes:
      - /opt/lyw/data/uploads:/data/uploads
    depends_on:
      lyw-storage-init: { condition: service_completed_successfully }
      lyw-mysql: { condition: service_healthy }
      lyw-mongo: { condition: service_healthy }
      lyw-redis: { condition: service_healthy }
    networks: [lyw_internal, dify_default]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/lyw/web/post/categories"]
      interval: 15s
      timeout: 8s
      retries: 15
      start_period: 45s

  lyw-frontend:
    build:
      context: /opt/lyw/current
      dockerfile: deploy/frontend/Dockerfile
    image: lyw-frontend:${RELEASE_ID:-current}
    container_name: lyw-frontend
    restart: unless-stopped
    mem_limit: 64m
    depends_on:
      lyw-backend: { condition: service_healthy }
    networks: [lyw_internal, dify_default]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 5s
      retries: 6

networks:
  lyw_internal:
    internal: true
  dify_default:
    external: true
    name: dify_default
