name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-security:
    name: Backend and security
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run Maven tests
        run: mvn --batch-mode --no-transfer-progress test

      - name: Run security regression tests
        env:
          PYTHONPATH: .
        run: >-
          python3 -m unittest
          tests.scripts.security.test_sanitize_sql
          tests.scripts.security.test_scan_repository
          -v

      - name: Scan checked-out files
        run: python3 scripts/security/scan_repository.py .

      - name: Scan all reachable Git objects
        run: python3 scripts/security/scan_repository.py --all-refs .

      - name: Check post-detail migration residuals
        shell: bash
        run: |
          set -euo pipefail

          test ! -e web/src/components/card/FavoriteDetail.vue
          test ! -e web/src/components/card/card-file.vue
          test ! -e web/src/components/card/card-fileView.vue

          if grep -R -n -E 'showModal[[:space:]]*\([^)]*fullItem|fullItem' web/src; then
            echo 'Found the removed imperative full-item interface.' >&2
            exit 1
          fi

          if grep -R -n -E 'sessionStorage.*author|author.*sessionStorage' web/src; then
            echo 'Found sessionStorage-based author selection.' >&2
            exit 1
          fi

          if grep -R -n -E 'FavoriteDetail|card-fileView|components/card/card-file' web/src; then
            echo 'Found a reference to a deleted post-detail implementation.' >&2
            exit 1
          fi

  web:
    name: Web tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run unit tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

  admin:
    name: Admin build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - name: Install locked dependencies
        run: npm ci --registry=https://registry.npmjs.org

      - name: Build production bundle
        run: npm run build

      - name: Audit dependencies
        run: npm audit --audit-level=low --registry=https://registry.npmjs.org

  migration-tests:
    name: MySQL migrations and identity integration
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4.6
        env:
          MYSQL_DATABASE: lyw
          # This disposable service must allow creating/dropping isolated test databases.
          MYSQL_ROOT_PASSWORD: change-me
          MYSQL_ROOT_HOST: "%"
        ports:
          - 127.0.0.1:3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -pchange-me --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y default-mysql-client

      - name: Set up Java 17
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Run migration and Python regression tests
        env:
          LYW_MIGRATION_TEST_DSN: mysql://root:change-me@127.0.0.1:3306/lyw
        run: python3 -m unittest discover -s tests -t . -v

      - name: Set up Node.js for identity runtime integration
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install locked web test dependencies
        working-directory: web
        run: npm ci --registry=https://registry.npmjs.org

      - name: Run isolated identity HTTP integration tests
        run: python3 -m scripts.run_backend_integration --containers

  compose-contract:
    name: Compose contract
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate single-server topology
        env:
          LYW_RUNTIME_ENV_FILE: ${{ runner.temp }}/lyw-runtime.env
        run: |
          touch "$LYW_RUNTIME_ENV_FILE"
          docker compose -f deploy/compose.yaml config --quiet
          python3 -m unittest tests.scripts.test_deployment_compose_contract -v
